<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 0;
            background-color: #f0f0f0;
        }
        .container {
            background-color: white;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        .brand-header {
            width: 120%;
            background: linear-gradient(90deg, #001847 0%, #003366 100%);
            padding: 10px;
        }
        .brand-header img {
            height: 60px;
            width: 900px;
        }
        .header {
            background-color: #000033;
            color: white;
            padding: 20px;
            margin-bottom: 30px;
        }
        .form-content {
            padding: 20px 40px 40px 40px;
        }
        .question {
            margin-bottom: 25px;
        }
        .radio-group {
            margin-top: 10px;
        }
        .radio-option {
            margin-right: 20px;
        }
        input[type="radio"] {
            margin-right: 5px;
        }
        .language-level label {
            margin-right: 20px;
        }
        input[type="text"] {
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 100px;
        }
        .fr-en {
            position: absolute;
            top: 20px;
            right: 20px;
            color: rgb(0, 0, 0);
        }

        .apply-btn {
            background-color: #002654;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            position: absolute;
            left: 64%;
            top: 123%;
        }
        .apply-btn:hover {
            background-color: #1c72e3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand-header">
            <img src="../AFLOGO.svg" alt="Air France Roblox">
        </div>

        <div class="header">
            <h1>Ramp Agent H/F/X</h1>
            <div class="fr-en">FR | EN</div>
        </div>

        <div class="form-content">
            <div class="question">
                <label>Are you at least 14 years old at the time of application?</label>
                <div class="radio-group">
                    <label class="radio-option"><input type="radio" name="age" value="yes"> Yes</label>
                    <label class="radio-option"><input type="radio" name="age" value="no"> No</label>
                </div>
            </div>

            <div class="question">
                <label>Do you have any experience as a Ramp Agent?</label>
                <div class="radio-group">
                    <label class="radio-option"><input type="radio" name="experience as Ramp Agent" value="yes"> Yes</label>
                    <label class="radio-option"><input type="radio" name="experience as Ramp Agent" value="no"> No</label>
                </div>
            </div>

            <div class="question">
                <label>Have you ever got a Ramp Agent training in any other airlines?</label>
                <div class="radio-group">
                    <label class="radio-option"><input type="radio" name="training in other airline" value="yes"> Yes</label>
                    <label class="radio-option"><input type="radio" name="training in other airline" value="no"> No</label>
                </div>
            </div>

            <div class="question">
                <label>Which device are you using to work?</label>
                <div class="radio-group">
                    <label class="radio-option"><input type="radio" name="device" value="pc"> PC</label>
                    <label class="radio-option"><input type="radio" name="device" value="phone">Phone</label>
                    <label class="radio-option"><input type="radio" name="device" value="playstation">Console</label>
                </div>
            </div>

            <div class="question">
                <label>What is your level of French?</label>
                <div class="radio-group">
                    <label class="radio-option"><input type="radio" name="french" value="beginner"> Beginner</label>
                    <label class="radio-option"><input type="radio" name="french" value="intermediate"> Intermediate</label>
                    <label class="radio-option"><input type="radio" name="french" value="fluent"> Fluent</label>
                </div>
            </div>

            <div class="question">
                <label>What is your level of English?</label>
                <div class="radio-group">
                    <label class="radio-option"><input type="radio" name="english" value="beginner"> Beginner</label>
                    <label class="radio-option"><input type="radio" name="english" value="intermediate"> Intermediate</label>
                    <label class="radio-option"><input type="radio" name="english" value="fluent"> Fluent</label>
                </div>
            </div>

            <div class="question">
                <label>In which time zone do you live?</label>
                <div class="radio-group">
                    <input type="text" placeholder="UTC+1">
                </div>
            </div>

            <div class="question">
                <label>Are you able to keep up with a growing flying quota per month?</label>
                <div class="radio-group">
                    <label class="radio-option"><input type="radio" name="quota" value="yes"> Yes</label>
                    <label class="radio-option"><input type="radio" name="quota" value="no"> No</label>
                </div>
            </div>

            <div class="question">
                <label>Are you willing to work for multiple companies Air France is handled by (e.g., DNATA, Goldair, Swissport)?</label>
                <div class="radio-group">
                    <label class="radio-option"><input type="radio" name="work for multiple compagny" value="yes"> Yes</label>
                    <label class="radio-option"><input type="radio" name="work for multiple compagny" value="no"> No</label>
                </div>
            </div>

            <div class="question">
                <label>Are you available to attend training sessions and meetings?</label>
                <div class="radio-group">
                    <label class="radio-option"><input type="radio" name="available for training and meeting" value="yes"> Yes</label>
                    <label class="radio-option"><input type="radio" name="available for training and meeting" value="no"> No</label>
                </div>
            </div>

            <div class="question">
                <label>Are you willing to receive a gate agent trainings and perform this position in the same time as ramp agent?</label>
                <div class="radio-group">
                    <label class="radio-option"><input type="radio" name="perform Gate and Ramp Agent at the same time" value="yes"> Yes</label>
                    <label class="radio-option"><input type="radio" name="perform Gate and Ramp Agent at the same time" value="no"> No</label>
                </div>
            </div>

            <div class="question">
                <label>Are you willing to commit to a long-term role as a Ramp Agent?</label>
                <div class="radio-group">
                    <label class="radio-option"><input type="radio" name="long-therm ramp agent" value="yes"> Yes</label>
                    <label class="radio-option"><input type="radio" name="long-therm ramp agent" value="no"> No</label>
                </div>
            </div>
        </div>
    </div>

    <a href="Ramp Agent/EnglishRamp.html" onclick="return validateForm();">
        <button class="apply-btn">Continue</button>
    </a>


    <script>
        document.addEventListener('DOMContentLoaded', function() {
            function validateForm(event) {
                event.preventDefault(); // Empêche la redirection immédiate
    
                let isValid = true;
                const form = document.querySelector('.form-content');
    
                // Récupérer les réponses
                const responses = {};
                const radioGroups = ['age', 'experience as Ramp Agent', 'training in other airline', 'device', 'french', 'English', 'quota', 'work for multiple compagny','available for training and meeting', 'perform Gate and Ramp Agent at the same time', 'long-therm ramp agent'];
    
                for (const group of radioGroups) {
                    const selected = document.querySelector(`input[name="${group}"]:checked`);
                    if (!selected) {
                        alert(`Please select an option for: ${group}`);
                        isValid = false;
                    } else {
                        responses[group] = selected.value;
                    }
                }
    
                // Récupérer le fuseau horaire
                const timezoneInput = document.querySelector('input[type="text"]').value.trim();
                const timezonePattern = /^UTC[+-]\d{1,2}$/;
    
                if (!timezoneInput || !timezonePattern.test(timezoneInput)) {
                    alert('Please enter a valid format like UTC+1 or UTC-5, without spaces.');
                    isValid = false;
                } else {
                    responses["timezone"] = timezoneInput;
                }
    
                // Récupérer le nom d'utilisateur enregistré dans localStorage
                const username = localStorage.getItem("username") || "Unknown User";
    
                // Vérification des erreurs avant l'envoi
                if (!isValid) return;
    
                // Construire l'embed pour Discord
                const embed = {
                    title: "New Ramp Agent Application",
                    color: 0xFF0000,
                    fields: [
                        { name: "Username", value: username, inline: true },
                        { name: "Timezone", value: responses["timezone"], inline: true },
                        ...Object.entries(responses).map(([key, value]) => ({
                            name: key.charAt(0).toUpperCase() + key.slice(1),
                            value: value,
                            inline: false
                        }))
                    ],
                    timestamp: new Date()
                };
    
                // Envoyer au webhook Discord
                sendToDiscord(embed);
            }
    
            function sendToDiscord(embed) {
                const webhookUrl = 'https://discord.com/api/webhooks/1334615279895969865/gZtwQvbIFWwAeUYlG4dL0bGXAk3sjpbItb8kfIBbJkzFO2gJTDcIp5-Tt6QS-YVPmY7B';
    
                fetch(webhookUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        embeds: [embed]  // Structure le message en tant qu'embed
                    }),
                })
                .then(response => {
                    if (response.ok) {
                        alert('Responses sent successfully!');
                        window.location.href = "Ramp Agent/EnglishRamp.html"; // Redirection après envoi
                    } else {
                        throw new Error('Failed to send responses.');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Failed to send responses. Please try again.');
                });
            }
    
            // Associer la validation et l'envoi au bouton "Continue"
            document.querySelector('.apply-btn').addEventListener('click', validateForm);
        });
    </script>
    
    
</body>
</html>
